name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - name: Verify portable compiler and launcher
        run: |
          node scripts/tests/toolchain.test.mjs
          npm run dev -- --help
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Frontend coverage gates
        if: runner.os == 'Linux'
        run: npm run test:coverage --workspace frontend
      - name: Script syntax and launcher safety regressions
        if: runner.os == 'Linux'
        run: npm run test:scripts
      - name: Runtime dependency audit
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports-${{ matrix.os }}
          path: |
            frontend/reports/
            frontend/coverage/
          retention-days: 14

  integration:
    name: PostgreSQL migration, concurrency and desktop/mobile games
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blufftable_ciqa
          POSTGRES_USER: blufftable
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blufftable -d blufftable_ciqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://blufftable:ci-only-password@127.0.0.1:5432/blufftable_ciqa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - name: Upload browser and backend diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integration-reports
          path: |
            server/reports/
            frontend/reports/
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  ci:
    name: CI passed
    if: always()
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq --exit-status 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
